services:
  postgres:
    image: postgres:17
    container_name: smart-campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_dev_password
      POSTGRES_DB: smart_campus_lms
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campus -d smart_campus_lms']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
